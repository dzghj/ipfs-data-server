name: GCP IPFS Backup

on:
  schedule:
    # Every 2 weeks on Sunday at 3 PM UTC
    - cron: "0 15 * * 0/2"
  workflow_dispatch:

jobs:
  gcp-backup:
    name: Stop VM, snapshot disk, restart VM
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Run GCP snapshot
        run: |
          PROJECT_ID="gen-lang-client-0103362464"
          VM_NAME="instance-ipfs-main-server"
          ZONE="us-west1-b"
          DISK_NAME="instance-20260811-224939"
          SNAPSHOT_NAME="ipfs-backup-$(date +%Y%m%d-%H%M%S)"

          gcloud config set project $PROJECT_ID

          echo "Stopping VM $VM_NAME..."
          gcloud compute instances stop $VM_NAME --zone=$ZONE

          echo "Waiting 15s for VM to fully stop..."
          sleep 15

          echo "Creating snapshot $SNAPSHOT_NAME from disk $DISK_NAME..."
          gcloud compute disks snapshot $DISK_NAME \
            --snapshot-names=$SNAPSHOT_NAME \
            --zone=$ZONE

          echo "Starting VM $VM_NAME..."
          gcloud compute instances start $VM_NAME --zone=$ZONE

          echo "✅ Snapshot $SNAPSHOT_NAME completed"

      - name: Ensure VM is restarted on failure
        if: failure()
        run: |
          gcloud config set project gen-lang-client-0103362464
          echo "Restarting VM after failure..."
          gcloud compute instances start instance-ipfs-main-server --zone=us-west1-b || true

      - name: Forward failure to backend (which relays to AI agent)
        if: failure()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping backend/agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"gcp-ipfs-backup\",\"status\":\"failure\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend"
