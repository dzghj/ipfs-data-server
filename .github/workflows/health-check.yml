name: Health Check

on:
  schedule:
    # Runs every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  health-check:
    name: Check server and database health
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        run: |
          echo "Running health check at $(date)"
          echo "Target URL: ${{ secrets.BACKEND_URL }}/api/health"
          echo "INTERNAL_API_SECRET set: ${{ secrets.INTERNAL_API_SECRET != '' }}"

          # --max-time 60: allow up to 60s for cold-start (Render free tier)
          # --retry 2: retry twice on transient failures
          # --retry-delay 10: wait 10s between retries
          # -H x-internal-secret: required to pass backend auth
          HTTP_STATUS=$(curl \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --retry-connrefused \
            --silent \
            --output /tmp/health.json \
            --write-out "%{http_code}" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/health" || echo "CURL_FAILED")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/health.json 2>/dev/null || echo "(no response body)"

          # Check curl itself didn't fail
          if [ "$HTTP_STATUS" = "CURL_FAILED" ]; then
            echo "❌ Could not reach the server after retries — possible causes:"
            echo "   1. BACKEND_URL secret is wrong or missing"
            echo "   2. Server is down or failed to wake up within 60s (Render cold start)"
            echo "   Current BACKEND_URL points to: ${{ secrets.BACKEND_URL }}"
            exit 1
          fi

          # Check HTTP 200
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Server returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Check DB field in response
          DB_STATUS=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','unknown'))" 2>/dev/null || echo "parse_error")
          echo "DB status: $DB_STATUS"

          if [ "$DB_STATUS" != "connected" ]; then
            echo "❌ Database is not connected (db=$DB_STATUS)"
            exit 1
          fi

          echo "✅ Server and database are healthy"

      - name: Send SMS alert on failure (direct Twilio — no backend dependency)
        if: failure()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$ALERT_PHONE_NUMBER" ]; then
            echo "Twilio secrets not set - skipping SMS"
            exit 0
          fi
          curl -s -w "\nHTTP:%{http_code}\n" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --user "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            --data-urlencode "To=${ALERT_PHONE_NUMBER}" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "Body=LegacyChain: backend/DB health check FAILED $(date -u '+%Y-%m-%d %H:%M UTC'). https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"health-check\",\"status\":\"${{ job.status }}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (SMS path is independent)"
