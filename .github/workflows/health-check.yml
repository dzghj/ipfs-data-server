name: Health Check

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health-check:
    name: Check server and database health
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        run: |
          echo "Running health check at $(date)"
          echo "Target URL: ${{ secrets.BACKEND_URL }}/api/health"

          # --max-time 15: fail if server takes more than 15s to respond
          HTTP_STATUS=$(curl \
            --max-time 15 \
            --silent \
            --output /tmp/health.json \
            --write-out "%{http_code}" \
            "${{ secrets.BACKEND_URL }}/api/health" || echo "CURL_FAILED")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/health.json 2>/dev/null || echo "(no response body)"

          # Check curl itself didn't fail
          if [ "$HTTP_STATUS" = "CURL_FAILED" ]; then
            echo "❌ Could not reach the server — check BACKEND_URL secret is set correctly"
            exit 1
          fi

          # Check HTTP 200
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Server returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Check DB field in response
          DB_STATUS=$(cat /tmp/health.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','unknown'))" 2>/dev/null || echo "parse_error")
          echo "DB status: $DB_STATUS"

          if [ "$DB_STATUS" != "connected" ]; then
            echo "❌ Database is not connected (db=$DB_STATUS)"
            exit 1
          fi

          echo "✅ Server and database are healthy"

      - name: Send SMS alert via Twilio on failure
        if: failure()
        run: |
          echo "Sending SMS alert via Twilio..."

          TWILIO_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json" \
            --user "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}" \
            --data-urlencode "To=${{ secrets.ALERT_PHONE_NUMBER }}" \
            --data-urlencode "From=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --data-urlencode "Body=⚠️ LegacyChain Alert: Health check FAILED at $(date -u). Check: https://github.com/${{ github.repository }}/actions")

          echo "Twilio response: $TWILIO_RESPONSE"
