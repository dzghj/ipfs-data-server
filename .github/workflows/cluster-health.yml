name: IPFS Node Health Check

# ─────────────────────────────────────────────────────────────────────────────
# VM1 and VM2 are retired (Oct 2026) — the Mac Mini is now the ONLY IPFS node.
# There is no cluster any more, so this no longer checks cluster peer
# membership; it checks the one thing that now matters: can the backend reach
# the Mac Mini's IPFS RPC API at all?
#
# The Mac Mini has no public inbound of its own. Reachability goes through the
# ipfs-AI-control agent's ngrok tunnel (already public for the agent's own
# port), which proxies /api/v0/* straight to Kubo's local API — the exact same
# path secure-share/ipfs-client.js uses in production (see commit that added
# the proxy route to ipfs-AI-control's src/server.js). If this check fails,
# uploads and views are actually down — there's no second node to fall back to
# any more, so this is now a hard failure worth the SMS alert.
#
# Config — Settings → Secrets and variables → Actions:
#   secrets: IPFS_SECRET (same value as the backend's IPFS_SECRET),
#            BACKEND_URL, INTERNAL_API_SECRET, TWILIO_*, ALERT_PHONE_NUMBER
#   vars   : IPFS_NODE_URL (the agent's ngrok URL; optional, falls back to the
#            current tunnel domain below)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ipfs-health:
    name: Check the Mac Mini's IPFS node is reachable
    runs-on: ubuntu-latest
    env:
      IPFS_NODE_URL: ${{ vars.IPFS_NODE_URL || 'https://conclude-pavilion-condense.ngrok-free.dev' }}
      IPFS_SECRET: ${{ secrets.IPFS_SECRET }}

    steps:
      - name: Check IPFS RPC API (via the Mac Mini agent's tunnel)
        run: |
          echo "Checking ${IPFS_NODE_URL}/api/v0/id ..."
          CODE=$(curl -s --max-time 20 -o /tmp/id.json -w "%{http_code}" \
            -X POST -H "X-Secret-Key: ${IPFS_SECRET}" \
            "${IPFS_NODE_URL}/api/v0/id" || echo 000)
          echo "HTTP ${CODE}"
          cat /tmp/id.json 2>/dev/null || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "IPFS_STATUS=DOWN" >> "$GITHUB_ENV"
            echo "::error::IPFS node unreachable (HTTP ${CODE}) — uploads and file views are down, there is no second node any more"
            exit 1
          fi

          PEER_ID=$(jq -r '.ID // "unknown"' /tmp/id.json 2>/dev/null || echo unknown)
          echo "IPFS_STATUS=UP" >> "$GITHUB_ENV"
          echo "OK: IPFS node reachable — peer ${PEER_ID}"

      - name: Send SMS alert on failure (direct Twilio — no backend dependency)
        if: failure()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$ALERT_PHONE_NUMBER" ]; then
            echo "Twilio secrets not set - skipping SMS"
            exit 0
          fi
          curl -s -w "\nHTTP:%{http_code}\n" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --user "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            --data-urlencode "To=${ALERT_PHONE_NUMBER}" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "Body=LegacyChain: IPFS node (Mac Mini) is DOWN $(date -u '+%Y-%m-%d %H:%M UTC') — uploads/views are affected, no second node exists any more. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ipfs-health\",\"status\":\"${{ job.status }}\",\"ipfs\":\"${IPFS_STATUS:-UNKNOWN}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (SMS path is independent)"
