name: IPFS Cluster Health Check

# ─────────────────────────────────────────────────────────────────────────────
# VM1/VM2 are retired. The cluster is now 2 nodes: the Mac Mini (bootstrap,
# critical — this is what secure-share/ipfs-client.js actually talks to for
# every upload/view) and this account's MacBook Air (follower, pure
# redundancy — losing it doesn't take the app down, just the backup copy).
#
# IPFS itself is checked via the SAME path secure-share/ipfs-client.js
# actually uses in production: Tailscale Funnel
# (https://davids-mac-mini.taile2344b.ts.net) fronting a small local proxy
# (legacychain-ipfs-proxy.js, lives on the Mac Mini, not in this repo) that
# routes /ipfs/* to Kubo's API (:5001) and /cluster/* to the Cluster REST
# API (:9094). NOT ipfs-AI-control's older ngrok tunnel
# (conclude-pavilion-condense.ngrok-free.dev) — the app stopped depending on
# that when the Funnel path was wired in, and checking it instead of the
# real path means this workflow can alert on an outage that doesn't actually
# affect the app (or miss one that does).
#
# IPFS down is a hard failure (SMS) — there's no fallback, uploads/views are
# actually broken. The follower alone being down is a soft warning only — no
# SMS, since the Mac Mini still serves everything by itself; it just means no
# redundancy until the MacBook Air reconnects.
#
# Config — Settings → Secrets and variables → Actions:
#   secrets: IPFS_SECRET, CLUSTER_API_USER, CLUSTER_API_PASSWORD,
#            BACKEND_URL, INTERNAL_API_SECRET, TWILIO_*, ALERT_PHONE_NUMBER
#   vars   : IPFS_NODE_URL, CLUSTER_API_URL (both optional, fall back to the
#            current tunnel URLs below — update here if either tunnel's
#            domain ever changes, no commit needed)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cluster-health:
    name: Check the IPFS cluster (Mac Mini + follower)
    runs-on: ubuntu-latest
    env:
      IPFS_NODE_URL: ${{ vars.IPFS_NODE_URL || 'https://davids-mac-mini.taile2344b.ts.net/ipfs' }}
      CLUSTER_API_URL: ${{ vars.CLUSTER_API_URL || 'https://davids-mac-mini.taile2344b.ts.net/cluster' }}
      IPFS_SECRET: ${{ secrets.IPFS_SECRET }}
      CLUSTER_API_USER: ${{ secrets.CLUSTER_API_USER }}
      CLUSTER_API_PASSWORD: ${{ secrets.CLUSTER_API_PASSWORD }}

    steps:
      - name: Check IPFS RPC API (Mac Mini, via Tailscale Funnel — the real production path)
        run: |
          # ipfs-AI-control's proxy (fronting Kubo) only allows /api/v0/add,
          # /api/v0/cat, /api/v0/pin/add through — /api/v0/id got 403'd once
          # that allowlist landed (see ipfs-AI-control's src/server.js). This
          # adds a tiny throwaway blob instead, which is both allowed and a
          # more faithful check anyway: it exercises the exact write path
          # real uploads use, not just a bare liveness ping.
          echo "Checking ${IPFS_NODE_URL}/api/v0/add ..."
          CODE=$(echo "cluster-health-check $(date -u +%s)" | curl -s --max-time 20 -o /tmp/id.json -w "%{http_code}" \
            -X POST -H "X-Secret-Key: ${IPFS_SECRET}" \
            -F "file=@-" \
            "${IPFS_NODE_URL}/api/v0/add" || echo 000)
          echo "HTTP ${CODE}"
          cat /tmp/id.json 2>/dev/null || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "IPFS_STATUS=DOWN" >> "$GITHUB_ENV"
            echo "::error::IPFS node unreachable (HTTP ${CODE}) — uploads and file views are down"
          else
            CID=$(jq -r '.Hash // "unknown"' /tmp/id.json 2>/dev/null || echo unknown)
            echo "IPFS_STATUS=UP" >> "$GITHUB_ENV"
            echo "OK: IPFS node reachable — test blob pinned as ${CID}"
          fi

      - name: Check cluster membership (both peers)
        run: |
          CODE=$(curl -s --max-time 20 -o /tmp/peers.json -w "%{http_code}" \
            -u "${CLUSTER_API_USER}:${CLUSTER_API_PASSWORD}" \
            "${CLUSTER_API_URL}/peers" || echo 000)
          echo "Cluster /peers → HTTP ${CODE}"

          if [ "$CODE" != "200" ]; then
            echo "CLUSTER_STATUS=UNKNOWN" >> "$GITHUB_ENV"
            echo "PEER_COUNT=0" >> "$GITHUB_ENV"
            echo "::warning::Cluster REST API unreachable (HTTP ${CODE}) — can't confirm follower node status"
            exit 0
          fi

          # ipfs-cluster streams /peers as newline-delimited JSON objects, not
          # a JSON array — slurp (-s) into one.
          jq -s '.' /tmp/peers.json > /tmp/peers-norm.json 2>/dev/null || echo '[]' > /tmp/peers-norm.json
          PEER_COUNT=$(jq 'length' /tmp/peers-norm.json 2>/dev/null || echo 0)
          PEER_COUNT=${PEER_COUNT//[!0-9]/}; [ -z "$PEER_COUNT" ] && PEER_COUNT=0
          echo "PEER_COUNT=${PEER_COUNT}" >> "$GITHUB_ENV"

          if [ "$PEER_COUNT" -ge 2 ]; then
            echo "CLUSTER_STATUS=UP" >> "$GITHUB_ENV"
            echo "OK: ${PEER_COUNT} cluster peers visible"
          elif [ "$PEER_COUNT" = 1 ]; then
            echo "CLUSTER_STATUS=DEGRADED" >> "$GITHUB_ENV"
            echo "::warning::Only 1 cluster peer visible — follower node (MacBook Air) may be down. No redundancy right now, but the Mac Mini alone still serves uploads/views."
          else
            echo "CLUSTER_STATUS=UNKNOWN" >> "$GITHUB_ENV"
            echo "::warning::Could not parse peer list"
          fi

      - name: Evaluate
        run: |
          echo "════════ IPFS Cluster Health ════════"
          echo "  IPFS (Mac Mini):   ${IPFS_STATUS:-UNKNOWN}"
          echo "  Cluster:           ${CLUSTER_STATUS:-UNKNOWN}  (${PEER_COUNT:-0} peers)"
          echo "═══════════════════════════════════"

          if [ "${IPFS_STATUS:-UNKNOWN}" != "UP" ]; then
            echo "::error::IPFS node is DOWN — this is a hard failure, uploads/views are broken, there's no fallback"
            exit 1
          fi

          echo "OK: IPFS up. Cluster: ${CLUSTER_STATUS:-UNKNOWN} (${PEER_COUNT:-0} peers) — a degraded cluster alone does not fail this check, since the Mac Mini still serves everything on its own."

      - name: Send SMS alert on failure (direct Twilio — no backend dependency)
        if: failure()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$ALERT_PHONE_NUMBER" ]; then
            echo "Twilio secrets not set - skipping SMS"
            exit 0
          fi
          curl -s -w "\nHTTP:%{http_code}\n" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --user "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            --data-urlencode "To=${ALERT_PHONE_NUMBER}" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "Body=LegacyChain: IPFS node (Mac Mini) is DOWN $(date -u '+%Y-%m-%d %H:%M UTC') — uploads/views are affected. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"cluster-health\",\"status\":\"${{ job.status }}\",\"ipfs\":\"${IPFS_STATUS:-UNKNOWN}\",\"cluster\":\"${CLUSTER_STATUS:-UNKNOWN}\",\"peer_count\":${PEER_COUNT:-0},\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (SMS path is independent)"
