name: IPFS Cluster Health Check

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  cluster-health:
    name: Check all 3 cluster nodes are online
    runs-on: ubuntu-latest

    steps:
      - name: Check VM1 - instance-ipfs-main-server (136.117.221.35)
        run: |
          echo "Checking VM1 at 136.117.221.35:9199..."
          RESPONSE=$(curl -s --max-time 15 \
            -o /tmp/vm1.json \
            -w "%{http_code}" \
            -u "${{ secrets.CLUSTER_API_USER }}:${{ secrets.CLUSTER_API_PASSWORD }}" \
            http://136.117.221.35:9199/id)
          echo "VM1 HTTP status: $RESPONSE"
          cat /tmp/vm1.json 2>/dev/null || true
          if [ "$RESPONSE" != "200" ]; then
            echo "VM1_STATUS=DOWN" >> $GITHUB_ENV
            echo "FAIL: VM1 (136.117.221.35) is DOWN (HTTP $RESPONSE)"
            exit 1
          else
            PEER_ID=$(cat /tmp/vm1.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id","unknown")[:30])' 2>/dev/null || echo "unknown")
            echo "VM1_STATUS=UP" >> $GITHUB_ENV
            echo "OK: VM1 is UP — peer: $PEER_ID"
          fi

      - name: Check VM2 - ipfs-second-server (34.148.116.154)
        run: |
          echo "Checking VM2 at 34.148.116.154:9199..."
          RESPONSE=$(curl -s --max-time 15 \
            -o /tmp/vm2.json \
            -w "%{http_code}" \
            -u "${{ secrets.CLUSTER_API_USER }}:${{ secrets.CLUSTER_API_PASSWORD }}" \
            http://34.148.116.154:9199/id)
          echo "VM2 HTTP status: $RESPONSE"
          cat /tmp/vm2.json 2>/dev/null || true
          if [ "$RESPONSE" != "200" ]; then
            echo "VM2_STATUS=DOWN" >> $GITHUB_ENV
            echo "FAIL: VM2 (34.148.116.154) is DOWN (HTTP $RESPONSE)"
            exit 1
          else
            PEER_ID=$(cat /tmp/vm2.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id","unknown")[:30])' 2>/dev/null || echo "unknown")
            echo "VM2_STATUS=UP" >> $GITHUB_ENV
            echo "OK: VM2 is UP — peer: $PEER_ID"
          fi

      - name: Check Mac Mini node (via peer list on VM1)
        run: |
          echo "Checking Mac Mini via peer list from VM1..."
          RESPONSE=$(curl -s --max-time 15 \
            -o /tmp/peers.json \
            -w "%{http_code}" \
            -u "${{ secrets.CLUSTER_API_USER }}:${{ secrets.CLUSTER_API_PASSWORD }}" \
            http://136.117.221.35:9199/peers)
          echo "Peers HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "MACMINI_STATUS=UNKNOWN" >> $GITHUB_ENV
            echo "PEER_COUNT=0" >> $GITHUB_ENV
            echo "Could not fetch peer list from VM1"
          else
            PEER_COUNT=$(cat /tmp/peers.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo "0")
            echo "PEER_COUNT=$PEER_COUNT" >> $GITHUB_ENV
            echo "Total peers visible from VM1: $PEER_COUNT"
            MAC_ONLINE=$(cat /tmp/peers.json | python3 -c 'import json,sys; peers=json.load(sys.stdin); mac=[p for p in peers if p.get("id","").startswith("12D3KooWFoF")]; print("UP" if mac else "DOWN")' 2>/dev/null || echo "UNKNOWN")
            echo "MACMINI_STATUS=$MAC_ONLINE" >> $GITHUB_ENV
            if [ "$MAC_ONLINE" = "UP" ]; then
              echo "OK: Mac Mini is UP"
            else
              echo "WARN: Mac Mini appears DOWN (peer 12D3KooWFoF... not found)"
            fi
          fi

      - name: Summary
        run: |
          echo "====== IPFS Cluster Health ======"
          echo "VM1   (136.117.221.35): ${VM1_STATUS:-UNKNOWN}"
          echo "VM2   (34.148.116.154):  ${VM2_STATUS:-UNKNOWN}"
          echo "Mac Mini:               ${MACMINI_STATUS:-UNKNOWN}"
          echo "Peers online: ${PEER_COUNT:-0} / 3"
          echo "================================="
          if [ "${VM1_STATUS}" != "UP" ] || [ "${VM2_STATUS}" != "UP" ]; then
            echo "FAIL: One or more core nodes are DOWN"
            exit 1
          fi
          echo "OK: Both core nodes healthy. Mac Mini: ${MACMINI_STATUS:-UNKNOWN}"

      - name: Send SMS alert via Twilio on failure
        if: failure()
        run: |
          FAILED=""
          [ "${VM1_STATUS}" != "UP" ] && FAILED="VM1 "
          [ "${VM2_STATUS}" != "UP" ] && FAILED="${FAILED}VM2 "
          [ "${MACMINI_STATUS}" = "DOWN" ] && FAILED="${FAILED}MacMini"
          curl -s -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json" \
            --user "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}" \
            --data-urlencode "To=${{ secrets.ALERT_PHONE_NUMBER }}" \
            --data-urlencode "From=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --data-urlencode "Body=LegacyChain Cluster Alert: DOWN nodes: ${FAILED}. Peers: ${PEER_COUNT:-0}/3. See: https://github.com/${{ github.repository }}/actions"
          echo "SMS sent"
