name: IPFS Daily Mirror

on:
  schedule:
    # Every week on Monday at 4 PM UTC
    - cron: "0 16 * * 1"
  workflow_dispatch:

jobs:
  ipfs-mirror:
    name: Pin IPFS CIDs on remote VM
    runs-on: ubuntu-latest

    steps:
      - name: Pin CIDs via SSH
        run: |
          echo "Running IPFS mirror at $(date)"

          # Write SSH private key
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          # Run pinning commands on remote VM
          # IPFS daemon runs as a systemd service on the VM (always on)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_SSH_USER }}@${{ secrets.VM_IP }} << 'EOF'
            IPFS_BIN=/usr/local/bin/ipfs

            CIDS=(
              "QmVMXPiiQSWFzX1qY2P4DxbenPZrFVu5FMmcg5MumrYtot"
              "QmUju1zDPgZxkRtu3vdR9uohiNdgRrx3Dgsgz3wSo7ETnx"
              "QmX4Dk8HVptvv7htKwjiT1m3APBZGLV36YYKqPJtPUiwvV"
            )

            for CID in "${CIDS[@]}"; do
              echo "Pinning $CID..."
              if $IPFS_BIN pin add "$CID"; then
                echo "✅ Pinned $CID"
              else
                echo "❌ Failed to pin $CID"
                exit 1
              fi
            done

            echo "✅ All CIDs pinned successfully"
          EOF

      - name: Send SMS alert via Twilio on failure
        if: failure()
        run: |
          echo "Sending SMS alert via Twilio..."

          TWILIO_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json" \
            --user "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}" \
            --data-urlencode "To=${{ secrets.ALERT_PHONE_NUMBER }}" \
            --data-urlencode "From=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --data-urlencode "Body=⚠️ LegacyChain Alert: IPFS Daily Mirror FAILED at $(date -u). Check: https://github.com/${{ github.repository }}/actions")

          echo "Twilio response: $TWILIO_RESPONSE"
