name: IPFS Daily Mirror

# VM1/VM2 are retired — this used to SSH into a VM's systemd ipfs service to
# keep a fixed list of CIDs pinned. The Mac Mini is now the only node, and it
# has no SSH reachable from GitHub's runners; instead this goes through the
# same ngrok-tunneled IPFS RPC proxy cluster-health.yml uses (see
# ipfs-AI-control's src/server.js — proxies /api/v0/* to Kubo's local API,
# authenticated with the same X-Secret-Key secure-share/ipfs-client.js sends).
#
# Config — Settings → Secrets and variables → Actions:
#   secrets: IPFS_SECRET, BACKEND_URL, INTERNAL_API_SECRET
#   vars   : IPFS_NODE_URL (optional, same default as cluster-health.yml)

on:
  schedule:
    # Every week on Monday at 4 PM UTC
    - cron: "0 16 * * 1"
  workflow_dispatch:

jobs:
  ipfs-mirror:
    name: Keep pinned CIDs alive on the IPFS node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IPFS_NODE_URL: ${{ vars.IPFS_NODE_URL || 'https://conclude-pavilion-condense.ngrok-free.dev' }}
      IPFS_SECRET: ${{ secrets.IPFS_SECRET }}

    steps:
      - name: Pin CIDs via the IPFS RPC proxy
        run: |
          echo "Running IPFS mirror at $(date)"

          CIDS=(
            "QmVMXPiiQSWFzX1qY2P4DxbenPZrFVu5FMmcg5MumrYtot"
            "QmUju1zDPgZxkRtu3vdR9uohiNdgRrx3Dgsgz3wSo7ETnx"
            "QmX4Dk8HVptvv7htKwjiT1m3APBZGLV36YYKqPJtPUiwvV"
          )

          FAILED=0
          for CID in "${CIDS[@]}"; do
            echo "Pinning ${CID} ..."
            CODE=$(curl -s --max-time 60 -o /tmp/pin.json -w "%{http_code}" \
              -X POST -H "X-Secret-Key: ${IPFS_SECRET}" \
              "${IPFS_NODE_URL}/api/v0/pin/add?arg=${CID}" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✅ Pinned ${CID}"
            else
              echo "❌ Failed to pin ${CID} (HTTP ${CODE})"
              cat /tmp/pin.json 2>/dev/null || true
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more CIDs failed to pin"
            exit 1
          fi
          echo "✅ All CIDs pinned successfully"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ipfs-mirror\",\"status\":\"${{ job.status }}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend"
