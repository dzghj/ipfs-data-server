name: IPFS Daily Mirror

on:
  schedule:
    # Every week on Monday at 4 PM UTC
    - cron: "0 16 * * 1"
  workflow_dispatch:

jobs:
  ipfs-mirror:
    name: Pin IPFS CIDs on remote VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pin CIDs via SSH
        run: |
          echo "Running IPFS mirror at $(date)"

          # Write SSH private key
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          # Run pinning commands on remote VM
          # IPFS daemon runs as a systemd service on the VM (always on)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VM_SSH_USER }}@${{ secrets.VM_IP }} bash -s << 'EOF'
            IPFS_BIN=/usr/local/bin/ipfs

            echo "--- diagnostics ---"
            systemctl is-active ipfs || true
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':5001|:4001' || echo "nothing listening on 5001/4001"
            curl -s -m 5 -o /dev/null -w "API http status: %{http_code}\n" http://127.0.0.1:5001/api/v0/version -X POST || echo "curl to API failed"
            echo "Connected peers: $($IPFS_BIN --api /ip4/127.0.0.1/tcp/5001 swarm peers 2>/dev/null | wc -l)"
            echo "-------------------"

            CIDS=(
              "QmVMXPiiQSWFzX1qY2P4DxbenPZrFVu5FMmcg5MumrYtot"
              "QmUju1zDPgZxkRtu3vdR9uohiNdgRrx3Dgsgz3wSo7ETnx"
              "QmX4Dk8HVptvv7htKwjiT1m3APBZGLV36YYKqPJtPUiwvV"
            )

            for CID in "${CIDS[@]}"; do
              echo "Pinning $CID (max 120s, progress below)..."
              if timeout 120 $IPFS_BIN --api /ip4/127.0.0.1/tcp/5001 pin add --progress "$CID"; then
                echo "✅ Pinned $CID"
              else
                echo "❌ Failed to pin $CID"
                exit 1
              fi
            done

            echo "✅ All CIDs pinned successfully"
          EOF

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ipfs-mirror\",\"status\":\"${{ job.status }}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend"
