name: Nominee Resend Check

on:
  schedule:
    # Runs every 3 days (at midnight on day 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31)
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  resend-check:
    name: Check and resend unopened nominee links
    runs-on: ubuntu-latest

    steps:
      - name: Call resend check endpoint
        run: |
          echo "Running nominee resend check at $(date)"
          echo "INTERNAL_API_SECRET set: ${{ secrets.INTERNAL_API_SECRET != '' }}"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/internal/run-resend-check" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Resend check failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Resend check completed successfully"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"nominee-resend\",\"status\":\"${{ job.status }}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend"
