name: Nominee Resend Check

on:
  schedule:
    # Runs every 3 days (at midnight on day 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31)
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  resend-check:
    name: Check and resend unopened nominee links
    runs-on: ubuntu-latest

    steps:
      - name: Call resend check endpoint
        run: |
          echo "Running nominee resend check at $(date)"
          echo "INTERNAL_API_SECRET set: ${{ secrets.INTERNAL_API_SECRET != '' }}"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/internal/run-resend-check" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Resend check failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Resend check completed successfully"

      - name: Send SMS alert via Twilio on failure
        if: failure()
        run: |
          echo "Sending SMS alert via Twilio..."

          TWILIO_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json" \
            --user "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}" \
            --data-urlencode "To=${{ secrets.ALERT_PHONE_NUMBER }}" \
            --data-urlencode "From=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --data-urlencode "Body=⚠️ LegacyChain Alert: Nominee resend check FAILED at $(date -u). Check: https://github.com/${{ github.repository }}/actions")

          echo "Twilio response: $TWILIO_RESPONSE"
