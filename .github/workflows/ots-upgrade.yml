name: OTS Proof Upgrade

# Uploaded files get a calendar-only OpenTimestamps commitment immediately
# (see secure-share/anchor.js); the Bitcoin attestation isn't attachable until
# the calendar's batched transaction has a few confirmations, typically a few
# hours later. This just calls the batch-upgrade endpoint on a schedule so
# proofs don't sit as "pending" forever — nothing here is urgent enough to
# alert on failure (an unattached proof just stays pending a bit longer, no
# data loss), so unlike health-check.yml/cluster-health.yml there's no SMS step.

on:
  schedule:
    # Every 4 hours - proofs typically become upgradeable within a few hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  upgrade:
    name: Upgrade pending OpenTimestamps proofs
    runs-on: ubuntu-latest

    steps:
      - name: Call upgrade-pending endpoint
        run: |
          echo "Running OTS proof upgrade at $(date)"
          echo "INTERNAL_API_SECRET set: ${{ secrets.INTERNAL_API_SECRET != '' }}"

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" --max-time 90 \
            -X POST "${{ secrets.BACKEND_URL }}/api/internal/ots/upgrade-pending?limit=200" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json
          echo

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Upgrade check failed with status $RESPONSE"
            exit 1
          fi

          CHECKED=$(jq -r '.checked // 0' /tmp/response.json 2>/dev/null || echo "?")
          UPGRADED=$(jq -r '.upgraded // 0' /tmp/response.json 2>/dev/null || echo "?")
          echo "✅ Checked $CHECKED pending proof(s), upgraded $UPGRADED to a Bitcoin attestation"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ots-upgrade\",\"status\":\"${{ job.status }}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (non-critical, no independent alert path for this one)"
