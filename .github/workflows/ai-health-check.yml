name: AI Agent Health Check

# The ipfs-AI-control agent runs on the Mac Mini (Tailscale-only, no public
# inbound), so this runner can't probe it directly. Instead the agent POSTs an
# outbound heartbeat to the backend every ~60s with its Ollama status; this
# workflow just reads that heartbeat from the (public) backend and alerts if the
# agent has gone quiet or Ollama is unhealthy. Nothing about the agent is
# exposed to the internet.
#
# Required secrets: BACKEND_URL, INTERNAL_API_SECRET (+ Twilio secrets for SMS).

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ai-health:
    name: Check AI agent heartbeat and Ollama status
    runs-on: ubuntu-latest

    steps:
      - name: Read agent heartbeat from backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "AI_AGENT_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "OLLAMA_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "BACKEND_URL secret not set - skipping"
            exit 0
          fi

          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          echo "Reading $BACKEND_URL/api/internal/agent/heartbeat ..."

          HTTP_CODE=$(curl -s --max-time 20 \
            -o /tmp/hb.json \
            -w "%{http_code}" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            "$BACKEND_URL/api/internal/agent/heartbeat")
          CURL_EXIT=$?

          echo "curl exit: $CURL_EXIT  HTTP status: $HTTP_CODE"
          cat /tmp/hb.json 2>/dev/null || echo "(no body)"
          echo

          if [ $CURL_EXIT -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "AI_AGENT_STATUS=UNREACHABLE" >> $GITHUB_ENV
            echo "OLLAMA_STATUS=UNKNOWN" >> $GITHUB_ENV
            echo "WARN: could not read heartbeat from backend (HTTP $HTTP_CODE)"
            exit 0
          fi

          eval "$(python3 - <<'PY'
import json
try:
    d = json.load(open("/tmp/hb.json"))
except Exception as e:
    print('AGENT=DOWN'); print('OLLAMA=UNKNOWN'); print('AGE=?'); raise SystemExit
if not d.get("present"):
    print('AGENT=DOWN'); print('OLLAMA=UNKNOWN'); print('AGE=none')
else:
    print(f"AGENT={'DOWN' if d.get('stale') else 'UP'}")
    o = (d.get("ollama") or {}).get("status") or "UNKNOWN"
    print(f"OLLAMA={o.upper()}")
    print(f"AGE={d.get('ageSeconds','?')}")
PY
)"

          echo "Parsed: agent=$AGENT ollama=$OLLAMA age=${AGE}s"
          echo "AI_AGENT_STATUS=$AGENT" >> $GITHUB_ENV
          echo "OLLAMA_STATUS=$OLLAMA" >> $GITHUB_ENV
          echo "HEARTBEAT_AGE=$AGE" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "====== AI Health Summary ======"
          echo "AI Agent: ${AI_AGENT_STATUS:-SKIPPED} (last heartbeat ${HEARTBEAT_AGE:-?}s ago)"
          echo "Ollama:   ${OLLAMA_STATUS:-SKIPPED}"
          echo "==============================="
          if [ "${AI_AGENT_STATUS}" = "DOWN" ]; then
            echo "FAIL: AI agent is down (no recent heartbeat) - check the Mac Mini"
            exit 1
          elif [ "${AI_AGENT_STATUS}" = "UNREACHABLE" ]; then
            echo "WARN: could not reach backend to read heartbeat"
          elif [ "${OLLAMA_STATUS}" = "DOWN" ]; then
            echo "WARN: Ollama down on the Mac Mini"
          elif [ "${OLLAMA_STATUS}" = "NO_MODEL" ]; then
            echo "WARN: Ollama up but model missing - run: ollama pull llama3.2"
          else
            echo "OK: AI health check passed"
          fi

      - name: Send SMS alert on failure (direct Twilio - no backend dependency)
        if: failure()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$ALERT_PHONE_NUMBER" ]; then
            echo "Twilio secrets not set - skipping SMS"
            exit 0
          fi
          curl -s -w "\nHTTP:%{http_code}\n" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --user "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            --data-urlencode "To=${ALERT_PHONE_NUMBER}" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "Body=LegacyChain: AI agent health check FAILED $(date -u '+%Y-%m-%d %H:%M UTC'). agent=${AI_AGENT_STATUS:-UNKNOWN} ollama=${OLLAMA_STATUS:-UNKNOWN}. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ai-health-check\",\"status\":\"${{ job.status }}\",\"ai_agent\":\"${AI_AGENT_STATUS:-UNKNOWN}\",\"ollama\":\"${OLLAMA_STATUS:-UNKNOWN}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (SMS path is independent)"
