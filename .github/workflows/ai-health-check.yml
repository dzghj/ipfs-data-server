name: AI Agent Health Check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ai-health:
    name: Check AI agent server and local AI model
    runs-on: ubuntu-latest

    steps:
      - name: Check AI agent server health endpoint
        run: |
          AGENT_URL="${{ secrets.AI_AGENT_HEALTH_URL }}"
          AGENT_SECRET="${{ secrets.AGENT_SECRET }}"

          if [ -z "$AGENT_URL" ]; then
            echo "AI_AGENT_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "AI_AGENT_HEALTH_URL secret not set - skipping"
          else
            echo "Checking AI agent at $AGENT_URL/health ..."
            RESPONSE=$(curl -s --max-time 15 -o /tmp/agent.json -w "%{http_code}" -H "X-Agent-Secret: $AGENT_SECRET" "$AGENT_URL/health" || echo "CURL_FAILED")
            echo "HTTP status: $RESPONSE"
            cat /tmp/agent.json 2>/dev/null || true
            if [ "$RESPONSE" = "CURL_FAILED" ] || [ "$RESPONSE" = "000" ]; then
              echo "AI_AGENT_STATUS=UNREACHABLE" >> $GITHUB_ENV
              echo "WARN: AI agent unreachable - ngrok may not be running"
            elif [ "$RESPONSE" = "200" ]; then
              echo "AI_AGENT_STATUS=UP" >> $GITHUB_ENV
              echo "OK: AI agent is UP"
            else
              echo "AI_AGENT_STATUS=DOWN" >> $GITHUB_ENV
              echo "FAIL: AI agent DOWN (HTTP $RESPONSE)"
            fi
          fi

      - name: Check Ollama model is loaded
        run: |
          OLLAMA_URL="${{ secrets.AI_AGENT_HEALTH_URL }}"

          if [ -z "$OLLAMA_URL" ]; then
            echo "OLLAMA_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "Ollama check skipped - no URL configured"
          else
            echo "Checking Ollama via $OLLAMA_URL/api/tags ..."
            RESPONSE=$(curl -s --max-time 15 -o /tmp/ollama.json -w "%{http_code}" "$OLLAMA_URL/api/tags")
            echo "HTTP status: $RESPONSE"
            if [ "$RESPONSE" != "200" ]; then
              echo "OLLAMA_STATUS=DOWN" >> $GITHUB_ENV
              echo "FAIL: Ollama not responding (HTTP $RESPONSE)"
            else
              MODEL_FOUND=$(cat /tmp/ollama.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('YES' if any('llama3' in m.get('name','') for m in d.get('models',[])) else 'NO')" 2>/dev/null || echo "UNKNOWN")
              echo "Model found: $MODEL_FOUND"
              if [ "$MODEL_FOUND" = "YES" ]; then
                echo "OLLAMA_STATUS=UP" >> $GITHUB_ENV
                echo "OK: Ollama UP and llama3 loaded"
              else
                echo "OLLAMA_STATUS=NO_MODEL" >> $GITHUB_ENV
                echo "WARN: Ollama UP but llama3 not found - run: ollama pull llama3.2"
              fi
            fi
          fi

      - name: Summary
        run: |
          echo "====== AI Health Summary ======"
          echo "AI Agent: ${AI_AGENT_STATUS:-SKIPPED}"
          echo "Ollama:   ${OLLAMA_STATUS:-SKIPPED}"
          echo "==============================="
          if [ "${AI_AGENT_STATUS}" = "DOWN" ] || [ "${OLLAMA_STATUS}" = "DOWN" ] || [ "${OLLAMA_STATUS}" = "NO_MODEL" ]; then
            echo "FAIL: AI components need attention"
            exit 1
          elif [ "${AI_AGENT_STATUS}" = "UNREACHABLE" ]; then
            echo "WARN: AI agent unreachable - start ngrok on Mac Mini: ngrok http 7070 --url https://conclude-pavilion-condense.ngrok-free.dev"
          else
            echo "OK: AI health check passed"
          fi
          echo "OK: AI health check passed"

      - name: Send SMS alert on failure
        if: failure()
        run: |
          ISSUES=""
          [ "${AI_AGENT_STATUS}" = "DOWN" ] && ISSUES="AI-Agent "
          [ "${OLLAMA_STATUS}" = "DOWN" ] && ISSUES="${ISSUES}Ollama "
          [ "${OLLAMA_STATUS}" = "NO_MODEL" ] && ISSUES="${ISSUES}llama3-missing"
          curl -s -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json" \
            --user "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}" \
            --data-urlencode "To=${{ secrets.ALERT_PHONE_NUMBER }}" \
            --data-urlencode "From=${{ secrets.TWILIO_FROM_NUMBER }}" \
            --data-urlencode "Body=LegacyChain AI Alert: ${ISSUES}down. Check: https://github.com/${{ github.repository }}/actions"
          echo "SMS sent"
