name: AI Agent Health Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ai-health:
    name: Check AI agent server and local AI model
    runs-on: ubuntu-latest

    steps:
      - name: Check AI agent server health endpoint
        env:
          AGENT_URL: ${{ secrets.AI_AGENT_HEALTH_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          if [ -z "$AGENT_URL" ]; then
            echo "AI_AGENT_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "AI_AGENT_HEALTH_URL secret not set - skipping"
            exit 0
          fi

          # Strip trailing slash
          AGENT_URL=$(echo "$AGENT_URL" | sed 's|/$||')
          echo "Checking AI agent at $AGENT_URL/health ..."

          HTTP_CODE=$(curl -s --max-time 15 \
            -o /tmp/agent.json \
            -w "%{http_code}" \
            -H "X-Agent-Secret: $AGENT_SECRET" \
            "$AGENT_URL/health")
          CURL_EXIT=$?

          echo "curl exit: $CURL_EXIT  HTTP status: $HTTP_CODE"
          cat /tmp/agent.json 2>/dev/null || true

          if [ $CURL_EXIT -ne 0 ] || [ "$HTTP_CODE" = "000" ]; then
            echo "AI_AGENT_STATUS=UNREACHABLE" >> $GITHUB_ENV
            echo "WARN: AI agent unreachable (curl exit $CURL_EXIT) - ngrok may not be running"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "AI_AGENT_STATUS=UP" >> $GITHUB_ENV
            echo "OK: AI agent is UP"
          else
            echo "AI_AGENT_STATUS=DOWN" >> $GITHUB_ENV
            echo "FAIL: AI agent DOWN (HTTP $HTTP_CODE)"
          fi

      - name: Check Ollama model is loaded
        env:
          AGENT_URL: ${{ secrets.AI_AGENT_HEALTH_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: |
          if [ -z "$AGENT_URL" ]; then
            echo "OLLAMA_STATUS=SKIPPED" >> $GITHUB_ENV
            echo "Ollama check skipped - no URL configured"
            exit 0
          fi

          # Strip trailing slash
          TARGET_URL=$(echo "$AGENT_URL" | sed 's|/$||')
          echo "Checking Ollama via $TARGET_URL/api/tags ..."

          HTTP_CODE=$(curl -s --max-time 15 \
            -o /tmp/ollama.json \
            -w "%{http_code}" \
            -H "X-Agent-Secret: $AGENT_SECRET" \
            "$TARGET_URL/api/tags")
          CURL_EXIT=$?

          echo "curl exit: $CURL_EXIT  HTTP status: $HTTP_CODE"

          if [ $CURL_EXIT -ne 0 ] || [ "$HTTP_CODE" = "000" ]; then
            echo "OLLAMA_STATUS=UNREACHABLE" >> $GITHUB_ENV
            echo "WARN: Ollama unreachable (curl exit $CURL_EXIT)"
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "OLLAMA_STATUS=DOWN" >> $GITHUB_ENV
            echo "FAIL: Ollama not responding (HTTP $HTTP_CODE)"
          else
            MODEL_FOUND=$(python3 -c 'import json; d=json.load(open("/tmp/ollama.json")); print("YES" if any("llama3" in m.get("name","") for m in d.get("models",[])) else "NO")' 2>/dev/null || echo "UNKNOWN")
            echo "Model found: $MODEL_FOUND"
            if [ "$MODEL_FOUND" = "YES" ]; then
              echo "OLLAMA_STATUS=UP" >> $GITHUB_ENV
              echo "OK: Ollama UP and llama3 loaded"
            else
              echo "OLLAMA_STATUS=NO_MODEL" >> $GITHUB_ENV
              echo "WARN: Ollama UP but llama3 not found - run: ollama pull llama3.2"
            fi
          fi

      - name: Summary
        run: |
          echo "====== AI Health Summary ======"
          echo "AI Agent: ${AI_AGENT_STATUS:-SKIPPED}"
          echo "Ollama:   ${OLLAMA_STATUS:-SKIPPED}"
          echo "==============================="
          if [ "${AI_AGENT_STATUS}" = "DOWN" ]; then
            echo "FAIL: AI agent is down"
            exit 1
          elif [ "${AI_AGENT_STATUS}" = "UNREACHABLE" ]; then
            echo "WARN: AI agent unreachable - check ngrok on Mac Mini"
          elif [ "${OLLAMA_STATUS}" = "DOWN" ] || [ "${OLLAMA_STATUS}" = "UNREACHABLE" ] || [ "${OLLAMA_STATUS}" = "NO_MODEL" ]; then
            echo "WARN: Ollama issue (${OLLAMA_STATUS}) - check Ollama on Mac Mini"
          else
            echo "OK: AI health check passed"
          fi

      - name: Send SMS alert on failure (direct Twilio — no backend dependency)
        if: failure()
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_PHONE_NUMBER: ${{ secrets.ALERT_PHONE_NUMBER }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$ALERT_PHONE_NUMBER" ]; then
            echo "Twilio secrets not set - skipping SMS"
            exit 0
          fi
          curl -s -w "\nHTTP:%{http_code}\n" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --user "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            --data-urlencode "To=${ALERT_PHONE_NUMBER}" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "Body=LegacyChain: AI agent health check FAILED $(date -u '+%Y-%m-%d %H:%M UTC'). agent=${AI_AGENT_STATUS:-UNKNOWN} ollama=${OLLAMA_STATUS:-UNKNOWN}. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Forward result to AI agent queue
        if: always()
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret not set - skipping agent notify"
            exit 0
          fi
          BACKEND_URL=$(echo "$BACKEND_URL" | sed 's|/$||')
          curl -s --max-time 30 -X POST "$BACKEND_URL/api/internal/github-event" \
            -H "x-internal-secret: $INTERNAL_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"workflow\":\"ai-health-check\",\"status\":\"${{ job.status }}\",\"ai_agent\":\"${AI_AGENT_STATUS:-UNKNOWN}\",\"ollama\":\"${OLLAMA_STATUS:-UNKNOWN}\",\"repository\":\"${{ github.repository }}\",\"run_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "WARN: could not reach backend (SMS path is independent)"
