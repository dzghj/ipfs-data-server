services:
  - type: web
    name: ipfs-data-server
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        generateValue: true
      # Join the tailnet so this service can reach the Mac Mini's IPFS API
      # directly (see Dockerfile / docker-entrypoint.sh / tailscale-forward.mjs)
      # instead of through a public tunnel. Generate at
      # https://login.tailscale.com/admin/settings/keys — reusable + ephemeral
      # recommended, so container restarts can re-auth and don't linger as
      # offline devices in the tailnet when they stop.
      - key: TS_AUTHKEY
        sync: false
      - key: IPFS_TAILNET_HOST
        value: 100.73.92.84
      - key: IPFS_TAILNET_PORT
        value: "5001"
      # secure-share/ipfs-client.js now talks to the local forwarder, which
      # relays to IPFS_TAILNET_HOST/PORT above over the tailnet.
      - key: IPFS_HOST
        value: 127.0.0.1
      - key: IPFS_PORT
        value: "5001"
      - key: IPFS_PROTOCOL
        value: http
      # secure-share/index.js's clusterPin() talks to the local forwarder too,
      # which relays to the Mac Mini's Cluster REST API (:9094) over the
      # tailnet. CLUSTER_API_PASSWORD is set manually in the Render dashboard,
      # never committed here — see CLUSTER_API_USER's matching entry in the
      # Mac Mini's ~/.ipfs-cluster/service.json (api.restapi.basic_auth_credentials).
      - key: CLUSTER_API_URL
        value: http://127.0.0.1:9094
      - key: CLUSTER_API_USER
        value: render-backend
      - key: CLUSTER_API_PASSWORD
        sync: false
      - key: CLUSTER_TAILNET_PORT
        value: "9094"

  - type: cron
    name: resend-cron
    env: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: ipfs-data-server
          envVarKey: INTERNAL_API_SECRET
      - key: CRON_TARGET_URL
        value: https://ipfs-data-server.onrender.com/api/internal/run-resend-check
