services:
  # NOTE: this service is actually deployed as a manually-configured Node Web
  # Service (Free plan), not synced from this Blueprint — Render has no
  # in-place way to switch an existing service's env (node/docker) after
  # creation, so Dockerfile/docker-entrypoint.sh/tailscale-forward.mjs below
  # are currently unused leftovers from an abandoned Tailscale-in-container
  # approach. Reaching the Mac Mini instead goes through Tailscale Funnel: a
  # public HTTPS URL (davids-mac-mini.taile2344b.ts.net) proxied by
  # legacychain-ipfs-proxy.js (runs directly on the Mac Mini, not in this
  # repo) which routes /ipfs/* -> Kubo's API (:5001) and /cluster/* -> the
  # Cluster REST API (:9094), since Funnel only exposes one port.
  - type: web
    name: ipfs-data-server
    env: node
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: IPFS_HOST
        value: davids-mac-mini.taile2344b.ts.net
      - key: IPFS_PROTOCOL
        value: https
      # ipfs-http-client defaults to "api/v0" off the bare host, which misses
      # the proxy's "/ipfs" prefix — see secure-share/ipfs-client.js.
      - key: IPFS_API_PATH
        value: /ipfs/api/v0
      # secure-share/index.js's clusterPin() builds this URL by simple string
      # concatenation (CLUSTER_API_URL + "/pins/<cid>"), so the "/cluster"
      # prefix just needs to be part of the base URL, no code-side path
      # option needed like IPFS_API_PATH above.
      # CLUSTER_API_PASSWORD is set manually in the Render dashboard, never
      # committed here — see CLUSTER_API_USER's matching entry in the Mac
      # Mini's ~/.ipfs-cluster/service.json (api.restapi.basic_auth_credentials).
      - key: CLUSTER_API_URL
        value: https://davids-mac-mini.taile2344b.ts.net/cluster
      - key: CLUSTER_API_USER
        value: render-backend
      - key: CLUSTER_API_PASSWORD
        sync: false

  - type: cron
    name: resend-cron
    env: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: ipfs-data-server
          envVarKey: INTERNAL_API_SECRET
      - key: CRON_TARGET_URL
        value: https://ipfs-data-server.onrender.com/api/internal/run-resend-check

  # The actual dead-man's switch — checks every user's checkinInterval
  # against lastCheckinAt and auto-grants nominee access once a user goes
  # overdue. See index.js's /api/internal/run-checkin-check. Same
  # cron-runner.js entrypoint as resend-cron, just a different target URL.
  - type: cron
    name: checkin-cron
    env: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: ipfs-data-server
          envVarKey: INTERNAL_API_SECRET
      - key: CRON_TARGET_URL
        value: https://ipfs-data-server.onrender.com/api/internal/run-checkin-check

  # Resends an unopened nominee vault-access link up to twice (own path —
  # see index.js's comment on why this can't share run-resend-check's path
  # with the unrelated invite-reminder cron above).
  - type: cron
    name: link-resend-cron
    env: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: ipfs-data-server
          envVarKey: INTERNAL_API_SECRET
      - key: CRON_TARGET_URL
        value: https://ipfs-data-server.onrender.com/api/internal/run-link-resend-check
